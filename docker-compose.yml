services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-vulntracker
    container_name: vulntracker-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: vulntracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vulntracker
      MYSQL_ROOT_PASSWORD: toor
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
